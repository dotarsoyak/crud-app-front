<h2 mat-dialog-title>Confirmar eliminación</h2>
<mat-dialog-content>
  ¿Está seguro que desea eliminar la póliza? {{data.idPoliza}}
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="onCancelClick()">Cancelar</button>
  <button mat-button color="warn" (click)="onConfirmClick()">Eliminar</button>
</mat-dialog-actions>
