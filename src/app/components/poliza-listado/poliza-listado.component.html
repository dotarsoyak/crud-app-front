<div class='card mt-5'>
  <div class='card-header'>
    <div class="row">
      <span style="font-size: 1.5em;">Polizas de: {{selectedEmpleado}}</span>
    </div>
  </div>

  <div class='card-body'>
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="idPoliza">
        <th mat-header-cell *matHeaderCellDef>Id Póliza</th>
        <td mat-cell *matCellDef="let poliza">
          {{ poliza.idPoliza }}
        </td>
      </ng-container>
      <ng-container matColumnDef="cantidad">
        <th mat-header-cell *matHeaderCellDef>Cantidad</th>
        <td mat-cell *matCellDef="let poliza">
          {{ poliza.cantidad }}
        </td>
      </ng-container>
      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let poliza">
          {{ poliza.fecha }}
        </td>
      </ng-container>
      <ng-container matColumnDef="accion">
        <th mat-header-cell *matHeaderCellDef>Acción</th>
        <td mat-cell *matCellDef="let poliza">
          <div class="btn-group" role="group" aria-label="Basic example">
            <input type="button" value="Abrir" class="btn btn-primary btn-sm"
              (click)="openDetalleDialog(poliza.idPoliza)">
            <!--<input type="button" value="Cancelar" class="btn btn-warning btn-sm">-->
            <input type="button" value="Eliminar" class="btn btn-danger btn-sm"
              (click)="openDialog('300ms', '200ms', poliza.idPoliza)">
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">No hay pólizas</td>
      </tr>
    </table>

    <mat-paginator [pageSize]="3" [pageSizeOptions]="[3, 6, 9,12,15]" showFirstLastButtons
      aria-label="Select page of periodic elements">
    </mat-paginator>

  </div><!--body-->
</div>
